name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EmployeeManagement/frontend/package-lock.json

      - name: Install dependencies
        working-directory: EmployeeManagement/frontend
        run: npm ci

      - name: Build frontend
        working-directory: EmployeeManagement/frontend
        run: npm run build

      # GitHub Pages does not rewrite React routes to index.html. Serving the
      # compiled app as 404.html lets BrowserRouter handle direct visits and
      # page refreshes such as /DEMO-WEB/login without switching to hash URLs.
      - name: Add React route fallback
        working-directory: EmployeeManagement/frontend
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: EmployeeManagement/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
